services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_platform
      POSTGRES_USER: ticket_app
      POSTGRES_PASSWORD: ticket_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
